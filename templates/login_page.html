<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>

<body>
    <header>
        <div class = 'heading-actions'>
            <h1><a class = 'page_heading_hyperlink'>LDH Hospital</a></h1>
                </div>
            </div>
        </div>
    </header>

    <div class = 'main-content'>
        <div class = 'login-container'>
            <h1 class = 'login-heading'>Login</h1> 

            <form action = '/' method = 'POST' id = 'login-form'>
                <div class = 'update-form-details'>
                    <div><label for = 'u_name'>Username</label></div>
                    <div>
                        <input class = 'login-input input_fields' type = 'text'  name = 'u_name' 
                        placeholder = 'Username'
                        maxlength="32" pattern="[\w@#$&.\-]{1,32}"
                        title="Please enter a valid username. Your username should have a minimum length of 6, and a maximum length of 32. You can only use these special characters @#$&.-_" required>
                    </div>
                </div>

                <div class = 'update-form-details'>
                    <div><label for = 'u_password'>Password</label></div>
                    <div>
                        <input class = 'login-input input_fields' type = 'text' name = 'u_password' 
                        placeholder = 'Password' 
                        maxlength="32" pattern="[\w@#$&.\-]{5,32}"
                        title="Please enter a valid password. Your password should have a minimum length of 6, and a maximum length of 32. You can only use these special characters @#$&.-_" required>
                    </div>
                </div>

                <input type = 'submit' value = 'Submit' class = 'login-button'>
            </form>

            <p>Not a member? <a href = '/register'>Sign Up</a></p>

            {% if flag1 == True %}
                <p>Invalid username or password</p>
            {% endif %}

            {% if flag2 == True %}
                <p>User is not registered, Sign Up instead</p>
            {% endif %}
        </div>
    </div>


    <footer>
        <p>&copy;  2025 LDH Hospital</p>
    </footer>

</body>
</html>

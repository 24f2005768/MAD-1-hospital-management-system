<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Treatment Details</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>

<body>
    <header>
        <div class = 'heading-actions'>
            <h1><a class = 'page_heading_hyperlink' href = '/doctor/{{ current_user.doctor_relationship.doctor_id }}'>LDH Hospital</a></h1>

            <div class = 'action-buttons'>
                <div class = 'search_bar'>
                    
                    <form action = '/doctor/{{ current_user.doctor_relationship.doctor_id }}/search' method = 'POST'>
                        <div class = 'flex-container'>
                            <div>
                                <a href = '/doctor/{{ current_user.doctor_relationship.doctor_id }}/notification-page'><i id = 'notification-bell' class="bi bi-bell-fill"></i></a>
                            </div>
                            <div class = 'search-flex-container'>
                                <div><input type = 'text' placeholder ="Enter Number or Name" name = 'query' id = 'search_bar'></div>
                                <div><button type="submit" id = 'search-icon'><i class="bi bi-search"></i></button></div>
                            </div>
                            <div>
                                <a href = '/logout'><i id = 'logout-button' class="bi bi-box-arrow-right"></i><span id = 'logout-button'>Logout</span></a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>

        <div class = 'main-content'>
            <div class = 'login-container'>
                <h1>Update Treatment Details</h1>
                <form action = '/doctor/update-treatment-details/{{ current_user.doctor_relationship.doctor_id }}/{{ treatment.treatment_id }}' method = "POST">
                    <div class = 'update-form-details'>
                        <label for = 'patient_name'>Patient Name</label>
                        <input type = 'text' name = 'patient_name' value = '{{ treatment.ap[0].p_ref.patient_name }}' disabled />
                    </div>

                    <div class = 'update-form-details'>
                        <label for = 'diagnosis'>Diagnosis</label>
                        <input type = 'text' name = 'diagnosis' value = '{{ treatment.diagnosis }}' placeholder = "Diagnosis">
                    </div>

                    <div class = 'update-form-details'>
                        <label for = 'notes'>Notes</label>
                        <input type = 'text' name = 'notes' value = '{{ treatment.notes }}' placeholder = "Notes">
                    </div>

                    <div class = 'update-form-details'>
                        <label for = 'tests'>Tests</label>
                        <input type = 'text' name = 'tests' value = '{{  treatment.tests }}' placeholder = "Tests">
                    </div>

                    <div class = 'update-form-details'>
                        <label for = 'prescription'>Prescription</label>
                        <input type = 'text' name = 'prescription' value = '{{ treatment.prescription }}' placeholder = "Prescription">
                    </div>

                    <div class = 'update-form-details'>
                        <label for = 'status'>Status</label>
                        <select name = 'status' class = 'dept-dropdown'>
                            {% for option_choice in list_of_options %}
                                {% if option_choice == treatment_status %}
                                    <option value = '{{ option_choice }}' selected>{{ option_choice }}</option>
                                {% else %}
                                    <option value = '{{ option_choice }}'>{{ option_choice }}</option>
                                {% endif %}
                            {% endfor %}
                        </select>
                    </div>

                    <input type ="submit" value = "Submit" class = 'login-button'>
                </form>
            </div>

        </div>

    <footer>
        &copy;  2025 LDH Hospital
    </footer>
</body>
</html>

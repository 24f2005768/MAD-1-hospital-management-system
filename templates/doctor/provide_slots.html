<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provide Slots</title>
    <link rel="stylesheet" href="/static/style.css">

</head>
<body>
    
    <header>
        <h1><a href = '/admin'></a>LDH Hospital</a></h1>

        <div class = 'search_bar'>
            
            <form action = '/admin/search' method = 'POST'>
                <div>
                    <input type = 'text' list = 'search_list' placeholder ="Enter ID, Number or Name" name = 'query'>

                    <datalist id = 'search_list'>
                        {% for patient in patients %}
                            <option value = '{{patient.patient_name}}'>{{patient.patient_name}}</option>
                        {% endfor %}

                        {% for doctor in doctors %}
                            <option value = '{{doctor.doctor_name}}'>{{doctor.doctor_name}}</option>
                        {% endfor %}

                        {% for dept in departments %}
                            <option value = '{{dept.department_name}}'>{{dept.department_name}}</option>
                        {% endfor %}
                    </datalist>

                    <input type ="submit" value = "Search">
                </div>
            </form>
        </div>
    </header>

    <div class = 'main-content'>
        <form action = '/doctor/provide_slots/{{d_id}}' method="POST">
            
            {% for d in list_of_next_7_dates %}
                <div>
                    <label>{{ d }}</label>
                    {% for s in slots %}
                        <input type = 'checkbox' value = '{{ d }}' name = '{{ s.slot_id }}'> {{ s.slot_time }}
                        {% endfor %}
                    </div>
                {% endfor %}
            <input type="submit" value = "Submit" class = "login-button">
        </form>
    </div>

    <footer>
        &copy;  2025 LDH Hospital
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Patient</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>
<body>
    <header>
        <div class = 'heading-actions'>
            <h1><a class = 'page_heading_hyperlink' href = ''>LDH Hospital</a></h1>
    </header>

    <div class = 'main-content'>
        <div class = 'login-container'>
            
            <h1>Register Patient</h1>
            <form action = '/register' method = 'POST'>
                <input type = 'text' name = 'u_name' placeholder ="User name*" required/>

                <input type = 'text' name = 'u_password' placeholder = "User password*" required />

                <input type = 'text' name = 'p_name' placeholder = "Patient's name*" required />

                <input type = 'text' name = 'p_age' placeholder = "Age*" required/>
                
                <input type = 'text' name = 'contact_info' placeholder = "Contact number*" required />
                
                <input type = 'text' name = 'email' placeholder = "Email"/>

                <input type = 'submit' value = 'Submit' class = 'login-button'>
            </form>
        </div>
    </div>

    <footer>
        &copy;  2025 LDH Hospital
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Patient</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1><a href = '/admin' class = 'page_heading_hyperlink'>LDH Hospital</a></h1>

        <div class = 'search_bar'>
            
            <form action = '/admin/search' method = 'POST'>
                <div>
                    <input type = 'text' list = 'search_list' placeholder ="Enter ID, Number or Name" name = 'query'>

                    <datalist id = 'search_list'>
                        {% for patient in patients %}
                            <option value = '{{patient.patient_name}}'>{{patient.patient_name}}</option>
                        {% endfor %}

                        {% for doctor in doctors %}
                            <option value = '{{doctor.doctor_name}}'>{{doctor.doctor_name}}</option>
                        {% endfor %}

                        {% for dept in departments %}
                            <option value = '{{dept.department_name}}'>{{dept.department_name}}</option>
                        {% endfor %}
                    </datalist>

                    <input type ="submit" value = "Search">
                </div>
            </form>
        </div>
    </header>

    <div class = 'main-content'>
        <div class = 'login-container'>
            
            <h1>Register Patient</h1>
            <form action = '/register' method = 'POST'>
                <input type = 'text' name = 'u_name' placeholder ="User name*" required/>

                <input type = 'text' name = 'u_password' placeholder = "User password*" required />

                <input type = 'text' name = 'p_name' placeholder = "Patient's name*" required />

                <input type = 'text' name = 'p_age' placeholder = "Age*" required/>
                
                <input type = 'text' name = 'contact_info' placeholder = "Contact number*" required />
                
                <input type = 'text' name = 'email' placeholder = "Email"/>

                <input type = 'submit' value = 'Submit' class = 'login-button'>
            </form>
        </div>
    </div>

    <footer>
        &copy;  2025 LDH Hospital
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Doctor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1><a href = '/admin' class = 'page_heading_hyperlink'>LDH Hospital</a></h1>

        <div class = 'search_bar'>
            
            <form action = '/admin/search' method = 'POST'>
                <div>
                    <input type = 'text' list = 'search_list' placeholder ="Enter ID, Number or Name" name = 'query'>

                    <datalist id = 'search_list'>
                        {% for patient in patients %}
                            <option value = '{{patient.patient_name}}'>{{patient.patient_name}}</option>
                        {% endfor %}

                        {% for doctor in doctors %}
                            <option value = '{{doctor.doctor_name}}'>{{doctor.doctor_name}}</option>
                        {% endfor %}

                        {% for dept in departments %}
                            <option value = '{{dept.department_name}}'>{{dept.department_name}}</option>
                        {% endfor %}
                    </datalist>

                    <input type ="submit" value = "Search">
                </div>
            </form>
        </div>
    </header>

    <div class = 'main-content'>
        <div class = 'login-container'>
            <h1>Update Doctor</h1>
            <form action = '/admin/doctor/update/{{did}}' method = 'POST'>
                <div class = 'update-form-details'>
                    <label for = 'u_id'>User Name</label>
                    <input type = 'text' name = 'u_id' value = '{{did}}' placeholder = "ID" disabled />
                </div>

                <div class = 'update-form-details'>
                    <label for = 'd_name'>Name</label>
                    <input type = 'text' name = 'd_name' value = '{{old_data.doctor_name}}' placeholder = "Name"/>
                </div>

                <div class = 'update-form-details'>
                    <label for = 'contact_info'>Contact Info</label>
                    <input type = 'text' name = 'contact_info' value = '{{old_data.doctor_contact_number}}' placeholder = "Contact number"/>
                </div>

                <div class = 'update-form-details'>
                    <label for = 'email'>Email</label>
                    <input type = 'text' name = 'email' value = '{{old_data.doctor_email}}' placeholder = "Email"/>
                </div>

                <div class = 'update-form-details'>
                    <label for = 'dept'>Department</label>
                    <select name = 'dept' class = 'dept-dropdown'>
                        {% for d in departments %}
                            {% if d.department_name == old_data.dept.department_name %}
                                <option value = '{{ d.department_name }}' selected>{{ d.department_name }}</option>
                            {% else %}
                                <option value = '{{ d.department_name }}'>{{ d.department_name }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>

                <div class = 'update-form-details'>
                    <p style = 'display: inline'>Blacklist</p>
                    <input type = 'checkbox' id = 'option1' name = 'blacklist' value = 'True'/>
                    <label for = 'option1'>True</label>

                    <input type = 'checkbox' id = 'option2' name = 'blacklist' value = 'False'/>
                    <label for = 'option2'>False</label><br>
                </div>
            <input type ="submit" value = "Submit" class = 'login-button'>
                        
            </form>
        </div>
    </div>

    <footer>
        &copy;  2025 LDH Hospital
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Patient</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>

<body>
    <header>
        <div class = 'heading-actions'>
            <h1><a class = 'page_heading_hyperlink' href = '/admin'>LDH Hospital</a></h1>

            <div class = 'action-buttons'>
                <div class = 'search_bar'>
                    
                    <form action = '/admin/search' method = 'POST'>
                        <div class = 'flex-container'>  
                            <div>                          
                                <a href = '/admin/notification-page'><i id = 'notification-bell' class="bi bi-bell-fill"></i></a>
                            </div>
                            <div class = 'search-flex-container'>
                                <div><input type = 'text' placeholder ="Enter Number or Name" name = 'query' id = 'search_bar'
                                    pattern="[\w ]{1,}" title="Please add a valid input. You can only use numbers and alphabets"></div>
                                <div><button type="submit" id = 'search-icon'><i class="bi bi-search"></i></button></div>
                            </div>
                            <div>
                                <a href = '/logout'><i id = 'logout-button' class="bi bi-box-arrow-right"></i><span id = 'logout-button'>Logout</span></a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <div class = 'main-content'>
        <div class = 'flex-boxes'>
            <div class = 'flex-headings'>
                <div id = 'center-heading' style="width: 60%;"><h2 id = 'center-heading'>Update Patient</h2></div>
                <div style="position:absolute;"><button class = 'buttons back-button' onclick = 'history.back()'>Go Back</button></div>
            </div>
        </div>

        <div class = 'login-container'>
            <form action = '/admin/patient/update/{{ pid }}' method = 'POST'>
                <div class = 'update-form-details'>
                    <div><label for = 'u_id'>User ID</label></div>
                    <div>
                        <input class = 'input_fields' type = 'text' name = 'u_id' value = '{{ pid }}' 
                        placeholder = "ID" disabled />
                    </div>
                </div>

                <div class = 'update-form-details'>
                    <div><label for = 'p_name'>Name</label></div>
                    <div>
                        <input class = 'input_fields' type = 'text' name = 'p_name' value = '{{ old_data.patient_name }}' 
                        placeholder = "Name" 
                        maxlength="64" pattern="[\a ]{1,64}"
                        title="Please enter a valid name. Your name should have a maximum length of 64 and you can only use alphabets and space" required/>
                    </div>
                </div>

                <div class = 'update-form-details'>
                    <div><label for = 'gender'>Gender</label></div>
                    <div>
                        <select name = 'gender' class = 'dept-dropdown'>
                            <option value = 'Male'>Male</option>
                            <option value = 'Female'>Female</option>
                            <option value = 'prefer_not_to_say'>Prefer not say</option>
                        </select>
                    </div>
                </div>

                <div class = 'update-form-details'>
                    <div><label for = 'p_age'>DOB</label></div>
                    <div><input class = 'input_fields' type = 'date' name = 'p_dob' 
                        placeholder = "Date of Birth*" required/></div>
                </div>

                <div class = 'update-form-details'>
                    <div><label for = 'contact_info'>Contact Number</label></div>
                    <div>
                        <input class = 'input_fields' type = 'text' name = 'contact_info' value = '{{ old_data.contact_info }}' 
                        placeholder = "Contact number" 
                        maxlength="10" minlength="10" pattern="[\d]{10}"
                        title="Please enter a valid 10 digit number"/>
                    </div>
                </div>

                <div class = 'update-form-details'>
                    <div><label for = 'email'>Email</label></div>
                    <div>
                        <input class = 'input_fields' type = 'email' name = 'email' value = '{{ old_data.patient_email }}' 
                        placeholder = "Email" />
                    </div>
                </div>

                <div class = 'update-form-details'>
                    <p style = 'display: inline'>Blacklist</p>
                    {% if old_data.patient_blacklisted == True %}
                        <div><input type = 'radio' id = 'option1' name = 'blacklist' value = 'True' checked/></div>
                        <div><label for = 'option1'>True</label></div>
                    {% else %}
                        <div><input type = 'radio' id = 'option1' name = 'blacklist' value = 'True'/></div>
                        <div><label for = 'option1'>True</label></div>
                    {% endif %}

                    {% if old_data.patient_blacklisted == False %}
                        <div><input type = 'radio' id = 'option2' name = 'blacklist' value = 'False' checked/></div>
                        <div><label for = 'option2'>False</label><br></div>
                    {% else %}
                        <div><input type = 'radio' id = 'option2' name = 'blacklist' value = 'False' checked/></div>
                        <div><label for = 'option2'>False</label><br></div>
                    {% endif %}
                </div>

            <input type="submit" value = "Submit" class = "login-button">

            </form>
        </div>
    </div>

    <footer>
        &copy;  2025 LDH Hospital
    </footer>
    
</body>
</html>

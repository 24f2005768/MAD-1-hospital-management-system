<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Patient</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>

<body>
    <header>
        <div class = 'heading-actions'>
            <h1><a class = 'page_heading_hyperlink' href = '/admin'>LDH Hospital</a></h1>

            <div class = 'action-buttons'>
                <div class = 'search_bar'>
                    
                    <form action = '/admin/search' method = 'POST'>
                        <div class = 'flex-container'>  
                            <div>                          
                                <a href = '/admin/notification-page'><i id = 'notification-bell' class="bi bi-bell-fill"></i></a>
                            </div>
                            <div class = 'search-flex-container'>
                                <div><input type = 'text' placeholder ="Enter Number or Name" name = 'query' id = 'search_bar'></div>
                                <div><button type="submit" id = 'search-icon'><i class="bi bi-search"></i></button></div>
                            </div>
                            <div>
                                <a href = '/logout'><i id = 'logout-button' class="bi bi-box-arrow-right"></i><span id = 'logout-button'>Logout</span></a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <div class = 'main-content'>
        <div class = 'login-container'>
            <h1>Update Patient</h1>
            <form action = '/admin/patient/update/{{ pid }}' method = 'POST'>
                <input type = 'text' name = 'u_id' value = '{{ pid }}' placeholder = "ID" disabled />

                <input type = 'text' name = 'p_name' value = '{{ old_data.patient_name }}' placeholder = "Name" />

                <input type = 'text' name = 'contact_info' value = '{{ old_data.contact_info }}' placeholder = "Contact number" />

                <input type = 'text' name = 'email' value = '{{ old_data.patient_email }}' placeholder = "Email" />

                <div>
                    <span>Blacklist:</span>
                    <input type = 'checkbox' id = 'option1' name = 'blacklist' value = 'True'/>
                    <label for = 'option1'>True</label>

                    <input type = 'checkbox' id = 'option2' name = 'blacklist' value = 'False'/>
                    <label for = 'option2'>False</label><br>
                </div>

            <input type="submit" value = "Submit" class = "login-button">

            </form>
        </div>
    </div>

    <footer>
        &copy;  2025 LDH Hospital
    </footer>
    
</body>
</html>

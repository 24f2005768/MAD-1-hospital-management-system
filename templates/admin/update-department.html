<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Department</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <div class = 'heading-actions'>
            <h1><a href = '/admin' class = 'page_heading_hyperlink'>LDH Hospital</a></h1>

            <div class = 'action-buttons'>
                <div class = 'search_bar'>
                    
                    <form action = '/admin/search' method = 'POST'>
                        <div>
                            <input type = 'text' list = 'search_list' placeholder ="Enter ID, Number or Name" name = 'query'>
                            <input type ="submit" value = "Search">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>

        <div class = 'main-content'>
            <div class = 'login-container'>
                <h1>Update Department</h1>

                <div class = 'form-fields'>
                    <form action = '/admin/department/update/{{ department.department_id }}' method = 'POST'>
                        <input type = 'text' name = 'dept_id' value = '{{department.department_id}}' style="height:3vh; width:15vw;" disabled />

                        <input type = 'text' name = 'dept_name' value = '{{department.department_name}}' placeholder = "Department Name" style="height:3vh; width:15vw;">

                        <input type = 'text' name = 'dept_description' value = '{{department.department_description}}' placeholder = "Department Description" style="height:20vh; width:15vw;">

                        <input type = 'submit' value = "Submit" class = 'login-button'>
                    </form>
                </div>
            </div>

        </div>

    <footer>
        &copy;  2025 LDH Hospital
    </footer>
    
</body>
</html>

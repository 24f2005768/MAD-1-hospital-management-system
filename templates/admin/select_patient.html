<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src = '/static/script.js'></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>

<body>
    <header>
        <div class = 'heading-actions'>
            <h1><a class = 'page_heading_hyperlink' href = '/admin'>LDH Hospital</a></h1>

            <div class = 'action-buttons'>
                <div class = 'search_bar'>
                    
                    <form action = '/admin/search' method = 'POST'>
                        <div class = 'flex-container'>  
                            <div>                          
                                <a href = '/admin/notification-page'><i id = 'notification-bell' class="bi bi-bell-fill"></i></a>
                            </div>
                            <div class = 'search-flex-container'>
                                <div><input type = 'text' placeholder ="Enter Number or Name" name = 'query' id = 'search_bar'
                                    pattern="[\w ]{1,}" title="Please add a valid input. You can only use numbers and alphabets"></div>
                                <div><button type="submit" id = 'search-icon'><i class="bi bi-search"></i></button></div>
                            </div>
                            <div>
                                <a href = '/logout' onclick="ConfirmLogout()"><i id = 'logout-button' class="bi bi-box-arrow-right" style="font-size: 23px;" onclick="ConfirmLogout()"></i></a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <div class = 'main-content'>
        <div class = 'heading-actions'>
            <h2></h2>
            <div class = 'action-buttons'>
                <div><button class = 'back-button' onclick = 'history.back()'>Go Back</button></div>
            </div>
        </div>

        <div class = 'message-container'>
            <form action = '/admin/select-patient' method = 'POST'>
                <h2>Select a Patient</h2>
                <div>
                    <div><img src = '/static/images/DefaultDepartment.png' height="170px"></div>

                    <div>
                        <label for = 'patients_name'>Patient: </label>
                        <select id = 'patients_name' name = 'patients_name' class="input_fields">
                            {% for p in patients %}
                                <option value = '{{ p.patient_id }}' name = 'patient-name'>{{ p.patient_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <input onclick = 'confirm_appointment_booking()' type="submit" value = "Select" class = "send-button">
            </form>
        </div>
    </div>
</body>
</html>

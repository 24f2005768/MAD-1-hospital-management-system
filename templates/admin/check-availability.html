<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Availablility</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <h1><a href = '/admin' class = 'page_heading_hyperlink'>LDH Hospital</a></h1>

        <div class = 'search_bar'>
            
            <form action = '/admin/search' method = 'POST'>
                <div>
                    <input type = 'text' list = 'search_list' placeholder ="Enter ID, Number or Name" name = 'query'>

                    <datalist id = 'search_list'>
                        {% for patient in patients %}
                            <option value = '{{patient.patient_name}}'>{{patient.patient_name}}</option>
                        {% endfor %}

                        {% for doctor in doctors %}
                            <option value = '{{doctor.doctor_name}}'>{{doctor.doctor_name}}</option>
                        {% endfor %}

                        {% for dept in departments %}
                            <option value = '{{dept.department_name}}'>{{dept.department_name}}</option>
                        {% endfor %}
                    </datalist>

                    <input type ="submit" value = "Search">
                </div>
            </form>
        </div>
    </header>

    <div class = 'main-content'>
        <h2>{{ doctor.doctor_name }}'s Availablility</h2>
        <table>
            <tbody>
                <tr>
                    <th>Date</th>
                    <th>Slot</th>
                </tr>

                {% for s in doctor_slots %}
                    <tr>
                        <td>{{s.date}}</td>
                        <td>{{s.s_sch.slot_time}}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <footer>
        &copy;  2025 LDH Hospital
    </footer>
</body>
</html>

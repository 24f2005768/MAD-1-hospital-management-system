<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Doctor</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>

<body>
    <header>
        <div class = 'heading-actions'>
            <h1><a class = 'page_heading_hyperlink' href = '/admin'>LDH Hospital</a></h1>

            <div class = 'action-buttons'>
                <div class = 'search_bar'>
                    
                    <form action = '/admin/search' method = 'POST'>
                        <div class = 'flex-container'>  
                            <div>                          
                                <a href = '/admin/notification-page'><i id = 'notification-bell' class="bi bi-bell-fill"></i></a>
                            </div>
                            <div class = 'search-flex-container'>
                                <div><input type = 'text' placeholder ="Enter Number or Name" name = 'query' id = 'search_bar'></div>
                                <div><button type="submit" id = 'search-icon'><i class="bi bi-search"></i></button></div>
                            </div>
                            <div>
                                <a href = '/logout'><i id = 'logout-button' class="bi bi-box-arrow-right"></i><span id = 'logout-button'>Logout</span></a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <div class = 'main-content'>
        <div class = 'login-container'>
            <h1>Register Doctor</h1>
            <form action = '/admin/doctor/add' method = 'POST'>

                <div>
                    <label for = 'u_name'>User Name</label>
                    <input type = 'text' name = 'u_name' placeholder = "User name*" required />
                </div>

                <div>
                    <label for = 'u_password'>User Password</label>
                    <input type = 'text' name = 'u_password' placeholder = "Password*" required />
                </div>

                <div>
                    <label for = 'd_name'>Name</label>
                    <input type = 'text' name = 'd_name' placeholder = "Name*" required />
                </div>
            
                <div>
                    <label for = 'contact_info'>Contact Number</label>
                    <input type = 'text' name = 'contact_info' placeholder = "Contact number" />
                </div>

                <div>
                    <label for = 'email'>Email</label>
                    <input type = 'text' name = 'email' placeholder = "Email" />
                </div>

                <div>
                    <label for = 'desc'>Description</label>
                    <input type = 'text' name = 'desc' placeholder = "Description" />
                </div>

                <div>
                    <label for = 'dept'>Department:</label>
                    <select name = 'dept'>
                        {% for d in departments %}
                            <option value = '{{d.department_name}}'>{{d.department_name}}</option>
                        {% endfor %}
                    </select>
                </div>
            
                <input type = 'submit' value = 'Submit' class = 'login-button'>
            </form>
        </div>
    </div>

    <footer>
        &copy;  2025 LDH Hospital
    </footer>
</body>
</html>

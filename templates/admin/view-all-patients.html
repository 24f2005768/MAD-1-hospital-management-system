<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View All Patients</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <div class = 'heading-actions'>
            <h1><a href = '/admin' class = 'page_heading_hyperlink'>LDH Hospital</a></h1>

            <div class = 'action-buttons'>
                <div class = 'search_bar'>
                    
                    <form action = '/admin/search' method = 'POST'>
                        <div>
                            <input type = 'text' list = 'search_list' placeholder ="Enter ID, Number or Name" name = 'query'>
                            <input type ="submit" value = "Search">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>

        <div class = 'main-content'>

            <div class = 'heading-actions'>
                <h2>All Patients</h2>

                <div class = 'action-buttons'>
                    <a href = '/register' class = 'buttons'>Add</a>
                </div>
            </div>

            <table>
                <tbody>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Contact number</th>
                        <th>Email</th>
                        <th>Blacklisted</th>
                    </tr>

                    {% for p in patients %}
                    <tr>
                        <td>{{ p.patient_id }}</td>
                        <td><a href = '/admin/patient/{{ p.patient_id }}'>{{p.patient_name}}</a></td>
                        <td>{{ p.contact_info }}</td>
                        <td>{{ p.patient_email }}</td>
                        {% if p.patient_blacklisted == 0%}
                             <td><input type = 'checkbox' disabled></td>
                            {% else %}
                             <td><input type = 'checkbox' disabled checked ="checked"></td>
                        {% endif %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    <footer>
        &copy;  2025 LDH Hospital
    </footer>
</body>
</html>
